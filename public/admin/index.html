<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>部落格專業管理後台 | GAVIN'S SELECT</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- 載入 Word / Pages 等級的 Quill 富文本視覺化編輯器 -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

  <style>
    /* 原生內嵌的 Pages / Word 視覺化編輯器樣式 */
    .gavin-richtext-wrapper {
      border: 2px solid #C8AD90;
      border-radius: 10px;
      overflow: hidden;
      background: #FFFFFF;
      margin-top: 6px;
      box-shadow: 0 3px 12px rgba(61, 53, 46, 0.06);
    }
    .gavin-richtext-wrapper .ql-toolbar.ql-snow {
      background: #FAF6F0;
      border: none !important;
      border-bottom: 2px solid #E6D5C3 !important;
      padding: 10px 14px !important;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .gavin-richtext-wrapper .ql-container.ql-snow {
      border: none !important;
      font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif !important;
      font-size: 16px;
      line-height: 1.85;
      color: #3D352E;
      background: #FFFFFF;
    }
    .gavin-richtext-wrapper .ql-editor {
      min-height: 480px;
      padding: 24px 30px !important;
    }
    .gavin-richtext-wrapper .ql-editor h2 {
      background-color: #E6D5C3;
      color: #3D352E;
      padding: 10px 18px;
      border-radius: 8px;
      border-left: 6px solid #C8AD90;
      font-weight: 700;
      margin: 22px 0 14px 0;
    }
    .gavin-richtext-wrapper .ql-editor h3 {
      background-color: #E6D5C3;
      color: #3D352E;
      padding: 8px 14px;
      border-radius: 6px;
      border-left: 4px solid #C8AD90;
      font-weight: 700;
      margin: 18px 0 12px 0;
    }
    .gavin-richtext-wrapper .ql-editor img {
      max-width: 100%;
      border-radius: 8px;
      margin: 12px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    const HTML_TEMPLATES = {
      "☕ 咖啡廳食記模板": `<h2>空間環境與氛圍亮點</h2><p>走進店裡最吸引人的就是採光與裝潢風格，整體的座位配置非常舒適...</p><h3>必拍角落與座位區</h3><ul><li><strong>窗邊採光區：</strong> 午後陽光灑落非常適合拍照。</li><li><strong>室內沙發區：</strong> 桌距寬敞，適合聊天或帶電腦工作。</li></ul><h2>完整菜單與價目表</h2><p>（點上方工具列的「🖼️ 圖片圖示」即可直接插入菜單照片）</p><h2>今日餐點與飲品真實心得</h2><h3>1. 招牌必點餐點名稱 ($價格)</h3><p>口感層次豐富，<span style="color: #b83b2b;"><strong>甜度適中完全不膩口</strong></span>...</p><h3>2. 手沖咖啡 / 特調飲品 ($價格)</h3><p>香氣濃郁，搭配甜點非常剛好！</p><h2>總結與訪店建議</h2><p>推薦給喜歡質感空間與精緻甜點的朋友，建議週末提早前往以免久候！</p>`,
      "✈️ 旅遊攻略模板": `<h2>行程總覽與行前準備</h2><p>這次規劃的行程涵蓋了必訪景點與私房美食，交通動線順暢不繞路！</p><h3>交通方式與必備票券</h3><ul><li><strong>交通建議：</strong> </li><li><strong>建議停留時間：</strong> </li></ul><h2>第一站：必訪人氣景點亮點</h2><p>現場風景非常壯觀，建議可以在上午時段抵達避開人潮...</p><h2>周邊順遊美食推薦</h2><p>逛完景點後步行即可抵達的在地人氣美食...</p><h2>旅遊小提醒與總結心得</h2><p>整體來說非常適合安排一日遊或多日放鬆行程！</p>`,
      "🏨 住宿開箱模板": `<h2>飯店位置與交通停車資訊</h2><p>飯店地理位置相當便利，周邊生活機能完善...</p><h2>大廳環境與公共設施開箱</h2><p>辦理入住的櫃檯人員親切，大廳設計充滿質感...</p><h2>房型開箱：空間、床鋪與衛浴細節</h2><h3>臥室與床鋪舒適度</h3><p>採光極佳，床墊軟硬適中，隔音表現也很不錯...</p><h3>衛浴空間與備品</h3><p>乾濕分離設計，洗沐備品香氣療癒...</p><h2>早餐餐點與整體住宿評價</h2><p>隔天早餐種類豐富，整體 CP 值相當高！</p>`,
      "🛍️ 好物評測模板": `<h2>為什麼會入手這款好物？(痛點與需求)</h2><p>平常在挑選這類產品時，最在意的就是實用性、質地與真實 CP 值...</p><h2>外觀包裝與核心亮點開箱</h2><ul><li><strong>亮點 1：</strong> </li><li><strong>亮點 2：</strong> </li><li><strong>亮點 3：</strong> </li></ul><h2>實際使用一段時間後的真實感受</h2><p>實際連續使用下來，最有感的地方在於...</p><h2>適合誰買？購買與團購優惠資訊</h2><p>如果你也有相同困擾，<span style="background-color: #fff2b2;"><strong>非常推薦趁這次團購優惠入手！</strong></span></p>`
    };

    if (window.CMS) {
      CMS.registerPreviewStyle("/styles/theme.css");

      // 註冊原生內嵌的 Pages / Word 視覺化編輯器 Widget (無需複製貼上，且自動連動上方模板下拉選單)
      var RichTextControl = createClass({
        componentDidMount: function() {
          var self = this;
          this.quill = new Quill(this.editorRef, {
            theme: 'snow',
            placeholder: '在此直接打字，或從 Mac Pages / Word 直接複製貼上！\n\n💡 提示：\n1. 在上方「選擇文章排版模板」切換選項，這裡就會自動帶入對應模板！\n2. 直接用滑鼠「反白任何文字」，即可點上方工具列改顏色、加螢光筆底色、改字體大小、加底線或置中對齊！',
            modules: {
              toolbar: {
                container: [
                  [{ 'header': [2, 3, false] }],
                  [{ 'size': ['small', false, 'large', 'huge'] }],
                  ['bold', 'italic', 'underline', 'strike'],
                  [{ 'color': [] }, { 'background': [] }],
                  [{ 'align': [] }],
                  [{ 'list': 'ordered'}, { 'list': 'bullet' }, 'blockquote'],
                  ['link', 'image', 'clean']
                ]
              }
            }
          });

          // 載入文章現有內容
          if (this.props.value) {
            this.quill.clipboard.dangerouslyPasteHTML(this.props.value);
          }

          // 當打字或修改樣式時，即時同步回 Decap CMS 儲存
          this.quill.on('text-change', function() {
            var html = self.quill.root.innerHTML;
            if (html === '<p><br></p>') html = '';
            self.props.onChange(html);
          });

          // 自動偵測上方「🎯 選擇文章排版模板」欄位變化，直接帶入模板！
          this.lastTemplate = null;
          this.poller = setInterval(function() {
            var entry = self.props.entry;
            if (!entry || !entry.getIn) return;
            var currentTemplate = entry.getIn(['data', 'templateType']);
            if (self.lastTemplate === null) {
              self.lastTemplate = currentTemplate;
              return;
            }
            if (currentTemplate && currentTemplate !== self.lastTemplate) {
              self.lastTemplate = currentTemplate;
              if (HTML_TEMPLATES[currentTemplate]) {
                var currentText = self.quill.getText().trim();
                var isDefaultTemplate = Object.values(HTML_TEMPLATES).some(function(t) {
                  var tempDiv = document.createElement('div');
                  tempDiv.innerHTML = t;
                  return tempDiv.innerText.trim() === currentText;
                });
                if (!currentText || isDefaultTemplate || confirm('要將下方文章內容直接帶入「' + currentTemplate + '」的預設段落嗎？')) {
                  self.quill.clipboard.dangerouslyPasteHTML(HTML_TEMPLATES[currentTemplate]);
                  self.props.onChange(self.quill.root.innerHTML);
                }
              }
            }
          }, 400);
        },

        componentWillUnmount: function() {
          if (this.poller) clearInterval(this.poller);
        },

        render: function() {
          var self = this;
          return h('div', { className: 'gavin-richtext-wrapper' },
            h('div', { ref: function(el) { self.editorRef = el; } })
          );
        }
      });

      var RichTextPreview = createClass({
        render: function() {
          return h('div', {
            className: 'article-body',
            dangerouslySetInnerHTML: { __html: this.props.value || '' }
          });
        }
      });

      CMS.registerWidget('richtext', RichTextControl, RichTextPreview);

      // 註冊繁體中文介面與部署按鈕文字
      CMS.registerLocale('zh_Hant', {
        app: {
          header: {
            content: '內容管理',
            workflow: '草稿審核',
            media: '圖片媒體庫',
            quickAdd: '➕ 快速新增',
          },
        },
        collection: {
          sidebar: {
            collections: '📂 網站管理選單',
            allCollections: '所有項目',
            searchAll: '搜尋所有內容...',
            searchIn: '搜尋',
          },
          collectionTop: {
            sortBy: '排序依',
            viewAs: '檢視模式',
            newButton: '➕ 新增%{collectionLabel}',
            ascending: '由舊到新',
            descending: '由新到舊',
          },
        },
        editor: {
          editorControl: { field: { optional: '選填' } },
          editorInterface: {
            toggleI18n: '切換多語系',
            togglePreview: '👁️ 顯示/隱藏右側排版預覽',
            toggleScrollSync: '同步滾動預覽',
          },
          editorToolbar: {
            publishing: '🚀 正在部署更新至網站...',
            publish: '🚀 立即發布更新',
            published: '✅ 已發布上線',
            unpublish: '取消發布',
            duplicate: '複製這篇',
            publishAndCreateNew: '🚀 發布並新增下一篇',
            deletePublishedEntry: '🗑️ 刪除此篇文章',
            saving: '儲存中...',
            save: '💾 儲存修改',
            backCollection: '← 返回 %{collectionLabel}',
            unsavedChanges: '有尚未發布的修改',
            changesSaved: '修改已同步至網站！',
          },
        },
        mediaLibrary: {
          mediaLibraryModal: {
            loading: '載入媒體庫中...',
            noAssetsFound: '目前還沒有上傳任何圖片',
            search: '搜尋圖片...',
            uploading: '圖片上傳中...',
            upload: '⬆️ 點此從電腦上傳新圖片',
            download: '下載圖片',
            deleteSelected: '🗑️ 刪除選取的圖片',
            chooseSelected: '✅ 確定插入選取的圖片',
          },
        },
      });
    }
  </script>
</body>
</html>
