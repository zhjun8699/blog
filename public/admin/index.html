  <!-- 載入 Word / Pages 等級的 Quill 富文本視覺化編輯器 -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

  <style>
    /* 原生內嵌的 Pages / Word 視覺化編輯器樣式 */
    .gavin-richtext-wrapper {
      border: 2px solid #C8AD90;
      border-radius: 10px;
      overflow: hidden;
      background: #FFFFFF;
      margin-top: 6px;
      box-shadow: 0 3px 12px rgba(61, 53, 46, 0.06);
    }
    .gavin-richtext-wrapper .ql-toolbar.ql-snow {
      background: #FAF6F0;
      border: none !important;
      border-bottom: 2px solid #E6D5C3 !important;
      padding: 10px 14px !important;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .gavin-richtext-wrapper .ql-container.ql-snow {
      border: none !important;
      font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif !important;
      font-size: 16px;
      line-height: 1.85;
      color: #3D352E;
      background: #FFFFFF;
    }
    .gavin-richtext-wrapper .ql-editor {
      min-height: 480px;
      padding: 24px 30px !important;
    }
    .gavin-richtext-wrapper .ql-editor.ql-blank::before {
      font-style: normal;
      color: #9E9287;
      line-height: 1.8;
    }
    .gavin-richtext-wrapper .ql-editor h2 {
      background-color: #E6D5C3;
      color: #3D352E;
      padding: 10px 18px;
      border-radius: 8px;
      border-left: 6px solid #C8AD90;
      font-weight: 700;
      margin: 22px 0 14px 0;
    }
    .gavin-richtext-wrapper .ql-editor h3 {
      background-color: #E6D5C3;
      color: #3D352E;
      padding: 8px 14px;
      border-radius: 6px;
      border-left: 4px solid #C8AD90;
      font-weight: 700;
      margin: 18px 0 12px 0;
    }
    .gavin-richtext-wrapper .ql-editor img {
      max-width: 100%;
      border-radius: 8px;
      margin: 12px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* 🌟 將 Word 編輯器工具列的英文下拉選單 (Normal / Heading / Size) 全部強制改成繁體中文！ */
    .ql-snow .ql-picker.ql-header { width: 135px !important; }
    .ql-snow .ql-picker.ql-header .ql-picker-label::before,
    .ql-snow .ql-picker.ql-header .ql-picker-item::before {
      content: '一般內文段落' !important;
    }
    .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="2"]::before,
    .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="2"]::before {
      content: '奶茶色大標題 (H2)' !important;
    }
    .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="3"]::before,
    .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="3"]::before {
      content: '奶茶色副標題 (H3)' !important;
    }

    .ql-snow .ql-picker.ql-size { width: 95px !important; }
    .ql-snow .ql-picker.ql-size .ql-picker-label::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item::before {
      content: '標準字體' !important;
    }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="small"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="small"]::before {
      content: '小字體' !important;
    }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="large"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="large"]::before {
      content: '大字體' !important;
    }
    .ql-snow .ql-picker.ql-size .ql-picker-label[data-value="huge"]::before,
    .ql-snow .ql-picker.ql-size .ql-picker-item[data-value="huge"]::before {
      content: '特大標題字' !important;
    }

    /* 將插入超連結的英文提示窗也改為中文 */
    .ql-snow .ql-tooltip::before { content: "連結網址：" !important; }
    .ql-snow .ql-tooltip a.ql-action::after { content: "修改" !important; }
    .ql-snow .ql-tooltip a.ql-remove::before { content: "移除" !important; }
    .ql-snow .ql-tooltip[data-mode=link]::before { content: "請輸入連結網址：" !important; }
    .ql-snow .ql-tooltip.ql-editing a.ql-action::after { content: "儲存連結" !important; }

<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    const HTML_TEMPLATES = {
      "☕ 咖啡廳食記模板": `<h2>空間環境與氛圍亮點</h2><p>走進店裡最吸引人的就是採光與裝潢風格，整體的座位配置非常舒適...</p><h3>必拍角落與座位區</h3><ul><li><strong>窗邊採光區：</strong> 午後陽光灑落非常適合拍照。</li><li><strong>室內沙發區：</strong> 桌距寬敞，適合聊天或帶電腦工作。</li></ul><h2>完整菜單與價目表</h2><p>（點上方工具列的「圖片圖示」即可直接插入菜單照片）</p><h2>今日餐點與飲品真實心得</h2><h3>1. 招牌必點餐點名稱 ($價格)</h3><p>口感層次豐富，<span style="color: #b83b2b;"><strong>甜度適中完全不膩口</strong></span>...</p><h3>2. 手沖咖啡 / 特調飲品 ($價格)</h3><p>香氣濃郁，搭配甜點非常剛好！</p><h2>總結與訪店建議</h2><p>推薦給喜歡質感空間與精緻甜點的朋友，建議週末提早前往以免久候！</p>`,
      "✈️ 旅遊攻略模板": `<h2>行程總覽與行前準備</h2><p>這次規劃的行程涵蓋了必訪景點與私房美食，交通動線順暢不繞路！</p><h3>交通方式與必備票券</h3><ul><li><strong>交通建議：</strong> </li><li><strong>建議停留時間：</strong> </li></ul><h2>第一站：必訪人氣景點亮點</h2><p>現場風景非常壯觀，建議可以在上午時段抵達避開人潮...</p><h2>周邊順遊美食推薦</h2><p>逛完景點後步行即可抵達的在地人氣美食...</p><h2>旅遊小提醒與總結心得</h2><p>整體來說非常適合安排一日遊或多日放鬆行程！</p>`,
      "🏨 住宿開箱模板": `<h2>飯店位置與交通停車資訊</h2><p>飯店地理位置相當便利，周邊生活機能完善...</p><h2>大廳環境與公共設施開箱</h2><p>辦理入住的櫃檯人員親切，大廳設計充滿質感...</p><h2>房型開箱：空間、床鋪與衛浴細節</h2><h3>臥室與床鋪舒適度</h3><p>採光極佳，床墊軟硬適中，隔音表現也很不錯...</p><h3>衛浴空間與備品</h3><p>乾濕分離設計，洗沐備品香氣療癒...</p><h2>早餐餐點與整體住宿評價</h2><p>隔天早餐種類豐富，整體 CP 值相當高！</p>`,
      "🛍️ 好物評測模板": `<h2>為什麼會入手這款好物？(痛點與需求)</h2><p>平常在挑選這類產品時，最在意的就是實用性、質地與真實 CP 值...</p><h2>外觀包裝與核心亮點開箱</h2><ul><li><strong>亮點 1：</strong> </li><li><strong>亮點 2：</strong> </li><li><strong>亮點 3：</strong> </li></ul><h2>實際使用一段時間後的真實感受</h2><p>實際連續使用下來，最有感的地方在於...</p><h2>適合誰買？購買與團購優惠資訊</h2><p>如果你也有相同困擾，<span style="background-color: #fff2b2;"><strong>非常推薦趁這次團購優惠入手！</strong></span></p>`
    };

    if (window.CMS) {
      CMS.registerPreviewStyle("/styles/theme.css");

      // 註冊原生內嵌的 Pages / Word 視覺化編輯器 Widget
      var RichTextControl = createClass({
        componentDidMount: function() {
          var self = this;
          this.quill = new Quill(this.editorRef, {
            theme: 'snow',
            placeholder: '請在此直接打字，或從 Mac Pages / Word 直接複製貼上！\n\n💡 排版小撇步：\n1. 在上方「選擇文章排版模板」切換選項，這裡就會自動帶入對應的食記/旅遊/住宿/好物段落！\n2. 用滑鼠「反白任何文字」，即可點上方工具列改文字顏色、加螢光筆底色、調整字體大小、加底線或置中對齊！',
            modules: {
              toolbar: {
                container: [
                  [{ 'header': [2, 3, false] }],
                  [{ 'size': ['small', false, 'large', 'huge'] }],
                  ['bold', 'italic', 'underline', 'strike'],
                  [{ 'color': [] }, { 'background': [] }],
                  [{ 'align': [] }],
                  [{ 'list': 'ordered'}, { 'list': 'bullet' }, 'blockquote'],
                  ['link', 'image', 'clean']
                ]
              }
            }
          });

          // 為工具列按鈕加上中文滑鼠懸停提示 (Tooltip)
          var wrapper = this.editorRef.parentNode;
          var tips = {
            '.ql-bold': '粗體 (Cmd+B)',
            '.ql-italic': '斜體 (Cmd+I)',
            '.ql-underline': '底線 (Cmd+U)',
            '.ql-strike': '刪除線',
            '.ql-color': '反白修改文字顏色',
            '.ql-background': '反白加上螢光筆底色',
            '.ql-align': '段落對齊方式 (靠左/置中/靠右)',
            '.ql-list[value="ordered"]': '數字編號清單',
            '.ql-list[value="bullet"]': '項目符號清單',
            '.ql-blockquote': '引言區塊',
            '.ql-link': '插入超連結網址',
            '.ql-image': '從電腦插入圖片',
            '.ql-clean': '清除選取文字的格式'
          };
          Object.keys(tips).forEach(function(sel) {
            var el = wrapper.querySelector(sel);
            if (el) el.setAttribute('title', tips[sel]);
          });

          if (this.props.value) {
            this.quill.clipboard.dangerouslyPasteHTML(this.props.value);
          }

          this.quill.on('text-change', function() {
            var html = self.quill.root.innerHTML;
            if (html === '<p><br></p>') html = '';
            self.props.onChange(html);
          });

          // 自動偵測上方「🎯 選擇文章排版模板」欄位變化，直接帶入模板
          this.lastTemplate = null;
          this.poller = setInterval(function() {
            var entry = self.props.entry;
            if (!entry || !entry.getIn) return;
            var currentTemplate = entry.getIn(['data', 'templateType']);
            if (self.lastTemplate === null) {
              self.lastTemplate = currentTemplate;
              return;
            }
            if (currentTemplate && currentTemplate !== self.lastTemplate) {
              self.lastTemplate = currentTemplate;
              if (HTML_TEMPLATES[currentTemplate]) {
                var currentText = self.quill.getText().trim();
                var isDefaultTemplate = Object.values(HTML_TEMPLATES).some(function(t) {
                  var tempDiv = document.createElement('div');
                  tempDiv.innerHTML = t;
                  return tempDiv.innerText.trim() === currentText;
                });
                if (!currentText || isDefaultTemplate || confirm('要將下方文章內容直接帶入「' + currentTemplate + '」的預設段落嗎？')) {
                  self.quill.clipboard.dangerouslyPasteHTML(HTML_TEMPLATES[currentTemplate]);
                  self.props.onChange(self.quill.root.innerHTML);
                }
              }
            }
          }, 400);
        },

        componentWillUnmount: function() {
          if (this.poller) clearInterval(this.poller);
        },

        render: function() {
          var self = this;
          return h('div', { className: 'gavin-richtext-wrapper' },
            h('div', { ref: function(el) { self.editorRef = el; } })
          );
        }
      });

      var RichTextPreview = createClass({
        render: function() {
          return h('div', {
            className: 'article-body',
            dangerouslySetInnerHTML: { __html: this.props.value || '' }
          });
        }
      });

      CMS.registerWidget('richtext', RichTextControl, RichTextPreview);
