      cursor: pointer;
      transition: all 0.2s;

    .tpl-btn:hover {
      background: #C8AD90;
      color: #fff;
    }

    const RichTextControl = createClass({
      componentDidMount() {
        const container = this.editorRef;
        if (!container) return;

        this.quill = new window.Quill(container, {
          theme: 'snow',
          placeholder: '請在此輸入文章內容...（支援反白文字改顏色、加螢光筆底色、置中對齊、插入圖片與直接複製貼上保留格式）',
          modules: {
            toolbar: [
              [{ 'header': [1, 2, 3, false] }],
              [{ 'size': ['small', false, 'large', 'huge'] }],
              ['bold', 'italic', 'underline', 'strike'],
              [{ 'color': [] }, { 'background': [] }],
              [{ 'align': [] }],
              [{ 'list': 'ordered'}, { 'list': 'bullet' }],
              ['blockquote', 'link', 'image', 'video'],
              ['clean']
            ]
          }
        });

        const initialVal = this.props.value || '';
        if (initialVal) {
          this.quill.clipboard.dangerouslyPasteHTML(initialVal);
        }

        this.quill.on('text-change', () => {
          const html = this.quill.root.innerHTML;
          this.props.onChange(html === '<p><br></p>' ? '' : html);
        });
      },

      insertTemplate(type) {
        if (!this.quill || !TEMPLATES[type]) return;
        const currentText = this.quill.getText().trim();
        if (currentText.length > 0) {
          if (!window.confirm('目前編輯器內已有文字，確定要在尾端加入此排版模板嗎？')) return;
          const length = this.quill.getLength();
          this.quill.clipboard.dangerouslyPasteHTML(length, '<br>' + TEMPLATES[type]);
        } else {
          this.quill.clipboard.dangerouslyPasteHTML(TEMPLATES[type]);
        }
      },

      render() {
        return h('div', { className: 'quill-wrapper' }, [
          h('div', { className: 'template-bar' }, [
            h('span', { style: { fontWeight: 'bold' } }, '⚡ 一鍵帶入段落模板：'),
            h('button', { type: 'button', className: 'tpl-btn', onClick: () => this.insertTemplate('food') }, '🍜 美味食記模板'),
            h('button', { type: 'button', className: 'tpl-btn', onClick: () => this.insertTemplate('travel') }, '✈️ 旅遊攻略模板'),
            h('button', { type: 'button', className: 'tpl-btn', onClick: () => this.insertTemplate('stay') }, '🏨 質感住宿模板'),
            h('button', { type: 'button', className: 'tpl-btn', onClick: () => this.insertTemplate('product') }, '🛍️ 好物開箱模板')
          ]),
          h('div', { ref: (el) => { this.editorRef = el; } })
        ]);
      }
    });

    const RichTextPreview = createClass({
      render() {
        return h('div', {
          style: {
            fontFamily: '"PingFang TC", sans-serif',
            lineHeight: '1.9',
            color: '#3D352E',
            padding: '20px',
            background: '#fff',
            borderRadius: '12px'
          },
          dangerouslySetInnerHTML: { __html: this.props.value || '' }
        });
      }
    });

    CMS.registerWidget('richtext', RichTextControl, RichTextPreview);
