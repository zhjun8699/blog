backend:
  name: git-gateway
  branch: main

# 3. 將後台系統介面與「發布/儲存」按鈕全部改為繁體中文！
locale: "zh_Hant"

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "📝 部落格文章管理 (含4大模板與SEO)"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "文章標題", name: "title", widget: "string" }
      - { label: "📝 存為草稿？(打勾則暫不公開於前台，取消打勾即正式發布)", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "發布日期 (設定未來時間即可預約定時發布)", name: "pubDate", widget: "datetime" }
      - { label: "👁️ 觀看次數起始值 (預設從 5000 起跳，可自由修改)", name: "baseViews", widget: "number", default: 5000, required: false }
      - { label: "SEO 自訂網址代稱 (Slug，例如: taichung-cafe-01)", name: "slug", widget: "string", required: false }
      - { label: "📌 是否設為首頁置頂？", name: "pinned", widget: "boolean", default: false, required: false }
      - { label: "文章主分類", name: "category", widget: "select", options: ["台灣美食", "國內外旅遊", "質感保養", "好物開箱", "好物團購"], default: "台灣美食" }
      - { label: "🎯 選擇文章排版模板標籤", name: "templateType", widget: "select", options: ["一般文章", "☕ 咖啡廳食記模板", "✈️ 旅遊攻略模板", "🏨 住宿開箱模板", "🛍️ 好物評測模板"], default: "一般文章" }
      - { label: "🏷️ 文章標籤 Tags", name: "tags", widget: "list", default: ["私藏推薦"], required: false }
      - { label: "文章首頁摘要描述", name: "description", widget: "text" }

      - label: "🔍 SEO 搜尋引擎最佳化專屬欄位 (展開設定)"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "SEO 搜尋標題 (Google 顯示標題)", name: "seoTitle", widget: "string", required: false }
          - { label: "SEO 搜尋描述 (Meta Description)", name: "seoDescription", widget: "text", required: false }
          - { label: "社群分享封面圖 (LINE/FB/IG 分享縮圖 OG Image)", name: "ogImage", widget: "image", required: false }
          - { label: "首圖圖片 ALT 替代文字 (提升圖片搜尋排名)", name: "imageAlt", widget: "string", required: false }

      - { label: "文章封面首圖", name: "heroImage", widget: "image", required: false }
      - { label: "文章主要內容 (可點擊下方黑條一鍵複製 4 大模板骨架貼上)", name: "body", widget: "markdown" }

      - label: "📍 店家 / 景點資訊小卡片 (選填)"
        name: "placeInfo"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "啟用店家資訊卡？", name: "enabled", widget: "boolean", default: false, required: false }
          - { label: "店家/景點名稱", name: "name", widget: "string", required: false }
          - { label: "地址", name: "address", widget: "string", required: false }
          - { label: "營業時間", name: "hours", widget: "string", required: false }
          - { label: "聯絡電話", name: "phone", widget: "string", required: false }
          - { label: "推薦指數", name: "rating", widget: "string", required: false }
          - { label: "Google Maps 導航網址", name: "mapUrl", widget: "string", required: false }

      - label: "🛍️ 好物推薦 / 團購導購卡片 (含雲端點擊成效追蹤)"
        name: "promoCard"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "啟用團購導購卡？", name: "enabled", widget: "boolean", default: false, required: false }
          - { label: "商品名稱 / 開團標題", name: "title", widget: "string", required: false }
          - { label: "商品圖片", name: "image", widget: "image", required: false }
          - { label: "優惠價標示", name: "price", widget: "string", required: false }
          - { label: "推薦短評", name: "summary", widget: "text", required: false }
          - { label: "按鈕文字", name: "buttonText", widget: "string", default: "🔥 點此前往開團優惠賣場", required: false }
          - { label: "團購購買網址", name: "url", widget: "string", required: false }
          - { label: "📊 導購成效追蹤代碼 ID (英文數字，如: skincare-promo-11)", name: "trackingId", widget: "string", required: false }

  - name: "settings"
    label: "⚙️ 網站全站設定 (圖片/分類/跑馬燈/顏色)"
    files:
      - name: "site_config"
        label: "全站外觀與欄位控制台"
        file: "src/data/siteConfig.json"
        fields:
          - label: "📢 頂部跑馬燈公告"
            name: "announcement"
            widget: "object"
            fields:
              - { label: "是否顯示？", name: "enabled", widget: "boolean", default: true }
              - { label: "公告文字", name: "text", widget: "string" }
              - { label: "跳轉連結", name: "link", widget: "string", required: false }

          - label: "🎨 頂部 Logo 與 Banner"
            name: "header"
            widget: "object"
            fields:
              - { label: "網站名稱", name: "logoText", widget: "string" }
              - { label: "🌟 瀏覽器分頁小圖示 (Favicon，取代預設圖示)", name: "favicon", widget: "image", required: false }
              - { label: "左上角 Logo 圖片 (取代網站文字)", name: "logoImage", widget: "image", required: false }
              - { label: "Banner 主標題", name: "bannerTitle", widget: "string" }
              - { label: "Banner 副標題", name: "bannerSubtitle", widget: "string" }
              - { label: "Banner 背景圖", name: "bannerBgImage", widget: "image", required: false }

          - label: "🗂️ 頂部分類選單"
            name: "categories"
            widget: "list"
            fields:
              - { label: "分類名稱", name: "name", widget: "string" }

          - label: "👤 右側邊欄與 IG 設定"
            name: "sidebar"
            widget: "object"
            fields:
              - { label: "個人簡介標題", name: "profileTitle", widget: "string" }
              - { label: "頭貼", name: "avatar", widget: "image" }
              - { label: "自我介紹", name: "bio", widget: "text" }
              - { label: "聯絡提示", name: "contactNote", widget: "string" }
              - { label: "IG 帳號", name: "igAccount", widget: "string" }
              - { label: "顯示 IG 牆", name: "showIgFeed", widget: "boolean", default: true }
              - { label: "顯示側邊欄廣告", name: "showSidebarAd", widget: "boolean", default: true }
              - { label: "廣告 HTML/文字", name: "sidebarAdContent", widget: "text", required: false }

          - label: "🖌️ 網站顏色微調"
            name: "colors"
            widget: "object"
            fields:
              - { label: "全站背景色", name: "bgMain", widget: "color", default: "#FAF6F0" }
              - { label: "奶茶色底框", name: "milkTeaBg", widget: "color", default: "#E6D5C3" }
              - { label: "深奶茶色按鈕", name: "milkTeaDark", widget: "color", default: "#C8AD90" }

          - { label: "📄 首頁每頁顯示幾篇", name: "postsPerPage", widget: "number", default: 6 }
