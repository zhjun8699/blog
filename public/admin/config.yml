backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "zh_Hant"

collections:
  - name: "blog"
    label: "📝 部落格文章管理 (含4大模板、品牌審稿密碼鎖與搜尋引擎最佳化)"
    label_singular: "文章"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{pubDate}} | {{category}})"
    fields:
      - label: "📋 快速套用文章排版模板 (切換將自動帶入下方內文框架)"
        name: "templateType"
        widget: "select"
        required: false
        options:
          - { label: "✨ 不套用模板（自由發揮）", value: "none" }
          - { label: "🍜 模板一：美味食記探店模板", value: "food" }
          - { label: "✈️ 模板二：國內外旅遊攻略模板", value: "travel" }
          - { label: "🏨 模板三：質感住宿開箱模板", value: "stay" }
          - { label: "🛍️ 模板四：質感好物 / 保養開箱模板", value: "product" }
        default: "none"
        hint: "💡 可點選內文編輯器上方的「一鍵帶入段落模板」按鈕快速插入排版框架。"

      - label: "📌 置頂此篇文章 (打勾後將優先固定於首頁第一篇)"
        name: "pinned"
        widget: "boolean"
        default: false
        required: false
        hint: "💡 開啟後，此篇文章會置頂於首頁最上方並顯示「📌 置頂精選」標籤。"

      - label: "🔒 文章上鎖密碼 (品牌審核文章專用，留空代表公開不設密碼)"
        name: "password"
        widget: "string"
        required: false
        default: ""
        hint: "💡 給廠商或品牌審稿時，請在此填入一組密碼（例如：2026 或 doko888）。設定後，前台訪客必須輸入正確密碼才能看到文章圖片與內文；審稿通過後只要把這裡清空再發布，就會立刻變回公開文章！"

      - label: "🙈 設為草稿 (打勾後前台將完全隱藏此篇文章)"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
        hint: "💡 若文章還沒寫完、連密碼鎖都不想顯示在首頁列表上，可先勾選設為草稿。"

      - label: "📌 文章標題 (支援表情符號與特殊符號)"
        name: "title"
        widget: "string"
        hint: "💡 請輸入文章主標題。"

      - label: "📂 文章分類"
        name: "category"
        widget: "select"
        options:
          - "台灣美食"
          - "國內外旅遊"
          - "質感保養"
          - "好物開箱"
          - "好物團購"
        default: "台灣美食"
        hint: "💡 請選擇此篇文章所屬的主題分類。"

      - label: "📅 發布日期 (支援未來日期預約排程發布)"
        name: "pubDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "💡 若設定為未來的日期，前台會在時間到達後才自動顯示。"

      - label: "🖼️ 文章首圖 / 封面照片 (建議尺寸：寬 1000～1200 像素，直式或橫式皆可完整顯示)"
        name: "heroImage"
        widget: "image"
        required: false
        hint: "📐【上傳尺寸建議】建議寬度 1000～1200 像素（直式、橫式或正方形皆可，前台首頁將 100% 完整顯示整張照片不裁切！⚠️ 上傳前請確認電腦圖片檔名為「純英文或數字」，如 cover-1.jpg）。"

      - label: "📝 文章簡短摘要 (選填，首頁將自動擷取內文前 5 行顯示)"
        name: "description"
        widget: "text"
        required: false
        hint: "💡 供搜尋引擎與社群分享預覽使用（約 50～100 字）。前台首頁卡片會自動擷取下方內文的前 5 行文字！"

      - label: "🔥 初始觀看次數 (預設 5000+ 起跳)"
        name: "baseViews"
        widget: "number"
        default: 5680
        value_type: "int"
        min: 0
        hint: "💡 前台顯示的起始人氣值，訪客每點閱一次會自動往上累加。"

      - label: "🏷️ 文章話題標籤"
        name: "tags"
        widget: "list"
        required: false
        default: ["台中美食", "開箱分享"]
        hint: "💡 可輸入多個話題標籤（以半形逗號分隔），方便讀者點擊標籤篩選相關文章。"

      - label: "🔍 搜尋引擎最佳化進階設定 (選填)"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "圖片替代說明文字", name: "imageAlt", widget: "string", required: false, hint: "💡 幫助 Google 圖片搜尋理解首圖內容，未填則自動使用文章標題。" }
          - { label: "自訂搜尋引擎標題", name: "seoTitle", widget: "string", required: false, hint: "💡 顯示於 Google 搜尋結果的專屬標題，留空則自動使用文章標題。" }
          - { label: "自訂搜尋引擎描述", name: "seoDescription", widget: "text", required: false, hint: "💡 顯示於 Google 搜尋結果下方的說明文字，留空則使用文章摘要。" }
          - { label: "社群分享預覽縮圖", name: "ogImage", widget: "image", required: false, hint: "💡 分享連結至 LINE / FB 時顯示的縮圖，建議尺寸 1200 × 630 像素。" }

      - label: "✍️ 文章完整內文 (視覺化編輯器：可反白改字色、加螢光筆底色、調整字體大小、置中對齊)"
        name: "body"
        widget: "richtext"

  - name: "settings"
    label: "🎨 修改版面 / 圖片 / 分類設定"
    files:
      - name: "site_config"
        label: "⚙️ 全站外觀、Logo、Banner、跑馬燈、側邊欄與配色設定"
        file: "src/data/siteConfig.json"
        fields:
          - label: "📄 首頁每頁顯示文章篇數"
            name: "postsPerPage"
            widget: "number"
            default: 6
            value_type: "int"
            hint: "💡 設定首頁每一頁要顯示幾篇文章（預設為 6 篇）。"

          - label: "📢 頂部動態跑馬燈設定"
            name: "announcement"
            widget: "object"
            fields:
              - label: "✅ 啟用頂部跑馬燈"
                name: "enabled"
                widget: "boolean"
                default: true
                hint: "💡 開啟後會在網站最頂端顯示動態跑馬燈公告列。"
              - label: "📝 跑馬燈顯示文字"
                name: "text"
                widget: "string"
                required: false
                hint: "💡 請輸入跑馬燈要滾動顯示的公告文字。"
              - label: "🔗 跑馬燈點擊跳轉連結 (選填，留空則純顯示文字)"
                name: "link"
                widget: "string"
                required: false
                hint: "💡 可填入團購網址、IG 連結或指定文章網址，訪客點擊跑馬燈文字即可直接前往！"

          - label: "🖼️ 網站頂部標誌、瀏覽器分頁小圖示與首頁大橫幅設定"
            name: "header"
            widget: "object"
            fields:
              - label: "🌟 瀏覽器分頁小圖示 (就是網址列分頁左邊那個小圖示！建議尺寸：128 × 128 像素 正方形 PNG)"
                name: "favicon"
                widget: "image"
                required: false
                hint: "📐【修改分頁小圖示】這裡就是修改瀏覽器分頁標籤上左邊那個小圖示的地方！建議上傳 128 × 128 像素或 200 × 200 像素（1:1 正方形 PNG）。⚠️ 請將電腦圖片檔名改為純英文（如 favicon.png）再上傳。"
              - label: "🔤 導覽列左上角品牌文字 (當未上傳標誌圖片時顯示)"
                name: "logoText"
                widget: "string"
                default: "哪裏。DOKO"
                hint: "💡 顯示於導覽列左上角與網站頁尾的網站名稱。"
              - label: "🖼️ 導覽列左上角標誌圖片 (建議尺寸：高 84 × 寬 240 像素內橫式透明 PNG，或 200 × 200 像素正方形)"
                name: "logoImage"
                widget: "image"
                required: false
                hint: "📐【上傳尺寸建議】前台導覽列顯示高度為 42 像素（建議上傳高 84 像素、寬 84～260 像素的透明背景 PNG）。⚠️ 請務必將電腦圖片檔名改為「純英文或數字」（例如 logo.png），勿使用中文或空白檔名！"
              - label: "🏠 首頁大橫幅主標題"
                name: "bannerTitle"
                widget: "string"
                default: "哪裏。DOKO"
                hint: "💡 顯示於首頁大橫幅中央的大字主標題。"
              - label: "✨ 首頁大橫幅副標題"
                name: "bannerSubtitle"
                widget: "string"
                required: false
                hint: "💡 顯示於首頁大橫幅主標題下方的介紹文字。"
              - label: "🏞️ 首頁頂部大橫幅背景圖片 (建議尺寸：1920 × 450 像素 或 1440 × 360 像素 橫式寬幅圖)"
                name: "bannerBgImage"
                widget: "image"
                required: false
                hint: "📐【上傳尺寸建議】最佳尺寸為 1920 × 450 像素 或 1440 × 360 像素（比例約 4:1 的橫式寬幅圖片），檔案大小建議 1MB 以內。⚠️ 檔名請用純英文數字（如 banner.jpg）。"

          - label: "🗂️ 頂部導覽列文章分類選單"
            name: "categories"
            widget: "list"
            hint: "💡 可新增、刪除或調整頂部導覽列顯示的文章分類名稱。"
            fields:
              - { label: "分類名稱", name: "name", widget: "string" }

          - label: "👤 右側邊欄：個人簡介、IG 動態與廣告專區"
            name: "sidebar"
            widget: "object"
            fields:
              - label: "📌 個人簡介區塊標題"
                name: "profileTitle"
                widget: "string"
                default: "關於 哪裏。DOKO"
              - label: "👤 側邊欄個人圓形頭像 (建議尺寸：400 × 400 像素 正方形 1:1)"
                name: "avatar"
                widget: "image"
                required: false
                hint: "📐【上傳尺寸建議】請上傳 400 × 400 像素（1:1 正方形）清晰照片，前台會自動裁切為圓形頭像。⚠️ 檔名請用純英文數字（如 avatar.png）。"
              - label: "💬 個人自我介紹文字 (支援換行)"
                name: "bio"
                widget: "text"
                required: false
                hint: "💡 顯示於側邊欄頭像下方的個人介紹文字。"
              - label: "📩 合作邀約備註欄 (顯示於自我介紹下方)"
                name: "contactNote"
                widget: "string"
                required: false
                hint: "💡 例如：合作邀約歡迎來信 k81928@gmail.com 或私訊 IG 小盒子。"
              - label: "📸 Instagram 帳號名稱 (不含 @ 符號，例如：chun._.1997)"
                name: "igAccount"
                widget: "string"
                required: false
                default: "chun._.1997"
                hint: "💡 直接輸入帳號英文數字即可，勿加上 @ 符號。"
              - label: "📱 在側邊欄顯示 Instagram 最新動態嵌入牆"
                name: "showIgFeed"
                widget: "boolean"
                default: true
              - label: "📣 在側邊欄顯示「精選推薦 / 廣告」區塊"
                name: "showSidebarAd"
                widget: "boolean"
                default: true
              - label: "🪧 側邊欄廣告區內容 (支援 HTML 或圖片語法，建議圖片尺寸：寬 600 像素 正方形或直式圖)"
                name: "sidebarAdContent"
                widget: "text"
                required: false
                hint: "📐【尺寸建議】若放入廣告圖片，建議寬度 600 × 600 像素（正方形）或 600 × 800 像素（直式）。"

          - label: "🎨 網站奶茶色系主題配色"
            name: "colors"
            widget: "object"
            fields:
              - { label: "網頁主背景色 (預設 #FAF6F0)", name: "bgMain", widget: "string", default: "#FAF6F0" }
              - { label: "奶茶色淺底色 (預設 #E6D5C3)", name: "milkTeaBg", widget: "string", default: "#E6D5C3" }
              - { label: "奶茶色深強調色 (預設 #9C7A54)", name: "milkTeaDark", widget: "string", default: "#9C7A54" }
