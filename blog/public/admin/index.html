<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>部落格專業管理後台 | GAVIN'S SELECT</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* 後台快速套用 4 大文章模板的浮動工具列 */
    .template-helper-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #3D352E;
      color: #FAF6F0;
      padding: 8px 16px;
      border-radius: 30px;
      z-index: 99999;
      display: flex;
      gap: 8px;
      align-items: center;
      font-family: sans-serif;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
    .template-helper-bar button {
      background: #E6D5C3;
      color: #3D352E;
      border: none;
      padding: 5px 11px;
      border-radius: 15px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    .template-helper-bar button:hover {
      background: #C8AD90;
      color: #fff;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- 1. 四大文章模板一鍵複製骨架工具列 (出現在後台底部) -->
  <div class="template-helper-bar">
    <span>📋 點擊複製預設文章排版骨架：</span>
    <button onclick="copyTemplate('cafe')">☕ 咖啡廳食記</button>
    <button onclick="copyTemplate('travel')">✈️ 旅遊攻略</button>
    <button onclick="copyTemplate('hotel')">🏨 住宿開箱</button>
    <button onclick="copyTemplate('review')">🛍️ 好物評測</button>
    <span id="copyToast" style="color: #90EE90; font-weight: bold; display: none;">✅ 已複製！可直接貼入文章內容</span>
  </div>

      review: `## 為什麼會入手這款好物？(痛點與需求)

    };

    function copyTemplate(type) {
      navigator.clipboard.writeText(templates[type]).then(() => {
        const toast = document.getElementById('copyToast');
        toast.style.display = 'inline';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
      });
    }
  </script>
</body>
</html>
